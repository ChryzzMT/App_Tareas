<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-10">

      <h1>Materias</h1>
      <br/>
      <button type="button"
              class="btn btn-primary"
              routerLink="/materias/editar">Nueva Materia</button>
      <br/>
      <table class="table table-hover">
        <thead>
        <tr>
          <th scope="col">idMateria</th>
          <th scope="col">nombreMateria</th>
          <th scope="col">prioridadMateria</th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
          @for (materia of materias; track materia.idMateria) {
            <tr>
              <th scope="row">{{ materia.idMateria }}</th>
              <td>{{ materia.nombreMateria }}</td>
              <td>{{ materia.prioridadMateria}}</td>
            </tr>
          }
        </tbody>
      </table>

    </div>
  </div>
</div>
