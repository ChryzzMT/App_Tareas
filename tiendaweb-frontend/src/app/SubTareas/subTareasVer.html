<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-10">

      <h1> Subtarea </h1>
      <br/>
      <button (click)="cargarcrearsubtarea()" class="btn btn-primary" routerLink="/subtarea/crear"> Nueva subtarea </button>
      <br/>
      <br/>
      <table class="table table-hover">
        <thead>
        <tr>
          <th scope="col"> Titulo </th>
          <th scope="col"> Tarea </th>
          <th scope="col"> Acciones </th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
          @for (subtarea1 of subtareas; track subtarea1.idsubtarea) {
            <tr>
              <td>{{ subtarea1.descripcion }}</td>

              <td>{{ subtarea1.tarea.titulo}}</td>

              <td>
                <div class="btn-group" role="group">
                  <button class="btn btn-outline-danger btn-sm" (click)="eliminarsubtarea(subtarea1.idsubtarea)">
                    Eliminar
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>

    </div>
  </div>
</div>
