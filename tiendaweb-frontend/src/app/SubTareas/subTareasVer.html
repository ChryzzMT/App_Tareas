<div class = "container">
  <div class = "row justify-content-center">
    <div class = "col-md-10">

      <h1> Subtarea </h1>
      <br/>
      <button class = "btn btn-primary" routerLink = "/subtarea-edicion"> Nueva subtarea </button>
      <br/>
      <br/>

      <table class = "table table-hover">
        <thead>
        <tr>
          <th scope = "col"> Titulo </th>
          <th scope = "col"> Tarea </th>

        </tr>
        </thead>
        <tbody class="table-group-divider">
          @for (subtarea of subtareas; track subtarea.idsubtarea) {
            <tr>
              <td>{{ subtarea.descripcion}}</td>
              <td>{{ subtarea.idtarea }}</td>
              <td>
                <div class="btn-group" role="group">
                  <button class="btn btn-outline-danger btn-sm" (click)="eliminarsubtarea(subtarea.idsubtarea)">Eliminar</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>

    </div>
  </div>
</div>
