<div class = "container">
  <div class = "row justify-content-center">
    <div class = "col-md-10">

      <h1> Tarea </h1>
      <br/>
      <button class = "btn btn-primary" routerLink = "/tarea"> Nueva Tarea </button>
      <br/>
      <br/>

      <table class = "table table-hover">
        <thead>
        <tr>
          <th scope = "col"> Titulo </th>
          <th scope = "col"> Descripcion </th>
          <th scope = "col"> Peso Tarea </th>
          <th scope = "col"> Fecha de Entrega </th>
          <th scope = "col"> Estado </th>
          <th scope = "col"> Id de la Materia </th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
          @for (tarea of tareas; track tarea.idTarea) {
            <tr>
              <td>{{ tarea.titulo }}</td>
              <td>{{ tarea.descripcion }}</td>
              <td>{{ tarea.pesoTarea }}</td>
              <td>{{ tarea.fechaEntrega }}</td>
              <td>{{ tarea.estado }}</td>
              <td>{{ tarea.idMateria }}</td>
              <td>
                <div class="btn-group" role="group">
                  <button class="btn btn-outline-primary btn-sm" (click)="editar(tarea)">Editar</button>
                  <button class="btn btn-outline-danger btn-sm" (click)="eliminar(tarea.titulo)">Eliminar</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>

    </div>
  </div>
</div>
