<div class = "container">
  <div class = "row justify-content-center">
    <div class = "col-md-6">

      <h2> {{ esEdicion ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>
      <br/>

      <div>
        <label class = "form-label"> Titulo </label>
        <input type = "text" class = "form-control" [(ngModel)] = "tarea.titulo">
      </div>

      <div>
        <label class = "form-label"> Descripcion </label>
        <input type = "text" class = "form-control" [(ngModel)] = "tarea.descripcion">
      </div>

      <div>
        <label class = "form-label"> Peso Tarea </label>
        <input type = "text" class = "form-control" [(ngModel)] = "tarea.pesoTarea">
      </div>

      <div>
        <label class = "form-label"> Fecha Entrega </label>
        <input type = "text" class = "form-control" [(ngModel)] = "tarea.fechaEntrega">
      </div>

      <div>
        <label class = "form-label"> Estado </label>
        <input type = "text" class = "form-control" [(ngModel)] = "tarea.estado">
      </div>

      <div>
        <label class = "form-label"> ID Materia </label>
        <input type = "text" class = "form-control" [(ngModel)] = "tarea.idMateria">
      </div>

      <div class = "text-center">
        @if (esEdicion) {
          <button class="btn btn-primary" (click)="actualizar()">Actualizar</button>
          <button class="btn btn-danger" (click)="eliminar()">Eliminar</button>
        } @else {
          <button class="btn btn-primary" (click)="guardar()">Guardar</button>
        }
        <button class="btn btn-secondary" routerLink="/tareas">Cancelar</button>
      </div>

    </div>
  </div>
</div>
