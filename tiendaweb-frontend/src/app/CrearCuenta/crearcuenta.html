<h1> Bienvenido, Aqui puedes Crear una cuenta nueva </h1>

<form (ngSubmit)="crearcuenta()">

  <legend> Requisitos para poder Crear una cuenta </legend>

  <label> Nombre :
    <input type="text"  name="nombre" placeholder="ej: Pepito" required  [(ngModel)]="Usuario.nombre">
  </label>
  <br>
  <label> Email: <input type="email" name="email" placeholder="pepito@gmail.com" required [(ngModel)]="Usuario.email">
  </label>
  <br>
  <label> Contrasena :
  <input type="password" name="contrasena" minlength="8" maxlength="18"  required [(ngModel)]="Usuario.contrasena"></label>
  <br>
  <button type="submit" >
  Crear Cuenta
  </button>





</form>
<button type="button"  routerLink="/login" >  Enviar al Iniciar Sesion </button>
