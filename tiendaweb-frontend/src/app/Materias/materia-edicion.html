<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Código</label>
        <input type="text"
               class="form-control"
               [(ngModel)]="materia.idMateria"
        >
      </div>
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="materia.nombreMateria">
      </div>

      <div class="mb-3">
        <label class="form-label">Prioridad Materia</label>
        <select class="form-select" [(ngModel)]="materia.prioridadMateria">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="8">8</option>
            <option value="13">13</option>
          </select>
      </div>
      <div class="text-center">
        @if (esEdicion) {
          <button class="btn btn-primary me-2" (click)="actualizar()">Actualizar</button>
        } @else {
          <button class="btn btn-primary me-2" (click)="guardar()">Guardar</button>
        }
        <button class="btn btn-secondary" routerLink="/materias">Cancelar</button>
      </div>
    </div>
  </div>
</div>
