<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Código</label>
          <input type="text"
                 [disabled]="producto.id == 0"
                 class="form-control"
                 [(ngModel)]="producto.id">
        </div>

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="producto.nombre">
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <input type="text" class="form-control" [(ngModel)]="producto.descripcion">
        </div>

        <div class="mb-3">
          <label class="form-label">Precio</label>
          <input type="number" class="form-control" [(ngModel)]="producto.precio">
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary me-2" (click)="guardar()">Guardar</button>
          <button type="button" class="btn btn-secondary" routerLink="/productos">Cancelar</button>
        </div>
    </div>
  </div>
</div>
